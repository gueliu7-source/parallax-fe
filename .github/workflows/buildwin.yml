# Compila a Forever Engine (com o port do Parallax) para Windows na nuvem do GitHub e gera o .exe.
# Versoes fixadas no que o projeto usava em 2021; se algum passo falhar, copie o log e mande para o Claude.
name: BuildWin

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  buildWindows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxelibs
        run: |
          haxelib setup C:/haxelib
          haxelib install lime 7.8.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.8.1
          haxelib install flixel-ui 2.4.0
          haxelib install flixel-addons 2.11.0
          haxelib install hscript
          haxelib install newgrounds
          haxelib install flixel-tools
          haxelib run lime setup -y
          haxelib install polymod 1.5.2
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib list
        shell: cmd

      - name: Create APIStuff
        run: echo "package;class APIStuff{public static var API:String = '';public static var EncKey:String = '';}" > source/APIStuff.hx

      - name: Compile
        run: haxelib run lime build windows -release

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin
